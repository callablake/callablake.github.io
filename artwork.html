<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calla Manwaring — art</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <a class="name" href="index.html">Calla Manwaring</a>
    <nav>
      <a href="index.html">Home</a>
      <a class="active" aria-current="page" href="store.html">Store</a>
    </nav>
  </header>

  <main>
    <section class="piece-detail">
      <p class="muted" id="detail-missing" hidden>Artwork not found. Please return to the gallery.</p>

      <div class="detail-grid" id="detail-grid">
        <figure class="detail-image">
          <a id="detail-full" href="#" title="Zoom in">
            <img id="detail-img" alt="">
          </a>
        </figure>

        <div class="detail-info">
          <h1 id="detail-title"></h1>
          <p class="price" id="detail-price"></p>

          <dl class="specs">
            <div><dt>Medium</dt><dd id="detail-medium"></dd></div>
            <div><dt>Size</dt><dd id="detail-size"></dd></div>
          </dl>

          <p class="description" id="detail-description" hidden></p>

          <div class="detail-actions">
            <a class="button" id="detail-purchase" href="#">Purchase</a>
            <a class="button button-outline" href="store.html">Return to gallery</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <h3>Contact</h3>
    <p><a href="https://www.instagram.com/callapaintings/"><i class="fab fa-instagram"></i> @callapaintings</a></p>
    <p><a href="mailto:callamanwaring3@gmail.com"><i class="fa-regular fa-envelope"></i> callamanwaring3@gmail.com</a></p>
  </footer>

  <script src="data.js"></script>
  <script>
    const PHOTOSWIPE = "https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/";
    const slug = new URLSearchParams(window.location.search).get("slug");

    const showMissing = () => {
      document.getElementById("detail-grid").hidden = true;
      document.getElementById("detail-missing").hidden = false;
    };

    // Full-resolution zoom viewer; the library and the big image load only on click
    const openZoom = async (art) => {
      if (!document.getElementById("pswp-css")) {
        const css = document.createElement("link");
        css.id = "pswp-css";
        css.rel = "stylesheet";
        css.href = PHOTOSWIPE + "photoswipe.css";
        // Opening before the styles arrive leaves the backdrop see-through
        const cssLoaded = new Promise((resolve) => {
          css.onload = css.onerror = resolve;
        });
        document.head.appendChild(css);
        await cssLoaded;
      }
      const { default: PhotoSwipe } = await import(PHOTOSWIPE + "photoswipe.esm.min.js");
      const viewer = new PhotoSwipe({
        dataSource: [{
          src: art.images.full,
          msrc: art.images.display,
          width: art.images.width,
          height: art.images.height,
          alt: `${art.title} painting`,
        }],
        bgOpacity: 0.96,
        maxZoomLevel: 2,
      });
      viewer.init();
    };

    const showArtwork = (art) => {
      document.title = `${art.title} — Calla Manwaring`;

      const img = document.getElementById("detail-img");
      img.src = art.images.display;
      img.alt = `${art.title} painting`;
      img.width = art.images.width;
      img.height = art.images.height;

      const zoomLink = document.getElementById("detail-full");
      zoomLink.href = art.images.full;
      zoomLink.addEventListener("click", (event) => {
        event.preventDefault();
        // If the viewer can't load, fall back to opening the image directly
        openZoom(art).catch(() => window.open(art.images.full, "_blank", "noopener"));
      });

      document.getElementById("detail-title").textContent = art.title;
      document.getElementById("detail-price").textContent = art.sold
        ? "Sold"
        : art.price || "Price upon request";
      document.getElementById("detail-medium").textContent = art.medium || "Medium TBD";
      document.getElementById("detail-size").textContent = art.size || "Size TBD";

      if (art.description) {
        const desc = document.getElementById("detail-description");
        desc.textContent = art.description;
        desc.hidden = false;
      }

      const purchase = document.getElementById("detail-purchase");
      if (art.sold) {
        purchase.removeAttribute("href");
        purchase.classList.add("is-disabled");
        purchase.setAttribute("aria-disabled", "true");
        purchase.textContent = "Sold";
      } else {
        purchase.href = `purchase.html?slug=${encodeURIComponent(art.slug)}`;
      }
    };

    window.loadArtworks()
      .then((works) => {
        const art = works.find((item) => item.slug === slug);
        art ? showArtwork(art) : showMissing();
      })
      .catch(showMissing);
  </script>
</body>
</html>
